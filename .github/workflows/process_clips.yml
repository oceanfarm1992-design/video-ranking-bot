name: Process Clips and Post

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Clips release tag to process (e.g. clips-20260922-120000)"
        required: true

jobs:
  process:
    # Only react to Hetzner's clips-* releases, not the video-* release
    # this job itself creates when posting the final video (avoids a
    # trigger loop) and not any other release on the repo.
    if: startsWith(github.event.release.tag_name, 'clips-') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies (ffmpeg)
        run: sudo apt-get install -y ffmpeg

      - name: Install CPU-only PyTorch, then the rest of requirements
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Process and upload
        env:
          CLIPS_RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python process_upload.py

      - name: Upload final video as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ranking-video-${{ github.run_number }}
          path: final_ranking_video.mp4
          retention-days: 7
