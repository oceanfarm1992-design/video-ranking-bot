name: Ranking Video Pipeline

on:
  # Scheduled runs moved to a cron job on the Hetzner VPS (see deploy/) —
  # GitHub-hosted runner IPs are blocked by YouTube's bot-check, dropping
  # 4 of 5 clips per run. Keeping workflow_dispatch only, for manual
  # testing without risking a duplicate scheduled run alongside the VPS.
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # Demucs (torch install + CPU inference per clip) adds real time
    permissions:
      contents: write   # needed to publish the video as a release asset
    env:
      TIKTOK_COOKIES: ${{ secrets.TIKTOK_COOKIES }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies (ffmpeg)
        run: sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Write TikTok cookies (if secret is set)
        if: ${{ env.TIKTOK_COOKIES != '' }}
        run: printf '%s' "$TIKTOK_COOKIES" > tiktok_cookies.txt

      - name: Run pipeline
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python main.py

      - name: Upload output video as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ranking-video-${{ github.run_number }}
          path: final_ranking_video.mp4
          retention-days: 7
