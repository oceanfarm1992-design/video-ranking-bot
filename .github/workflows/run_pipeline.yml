name: Ranking Video Pipeline

on:
  schedule:
    - cron: "0 8  * * *"   # 08:00 UTC — morning   (US East 4am / UK 8am)
    - cron: "0 15 * * *"   # 15:00 UTC — afternoon (US East 11am / UK 3pm)
    - cron: "0 21 * * *"   # 21:00 UTC — evening   (US East 5pm / UK 9pm)
  workflow_dispatch:        # Also runnable manually from the Actions tab

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # Demucs (torch install + CPU inference per clip) adds real time
    permissions:
      contents: write   # needed to publish the video as a release asset

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies (ffmpeg)
        run: sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Write TikTok cookies (if secret is set)
        if: ${{ secrets.TIKTOK_COOKIES != '' }}
        env:
          TIKTOK_COOKIES: ${{ secrets.TIKTOK_COOKIES }}
        run: printf '%s' "$TIKTOK_COOKIES" > tiktok_cookies.txt

      - name: Run pipeline
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python main.py

      - name: Upload output video as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ranking-video-${{ github.run_number }}
          path: final_ranking_video.mp4
          retention-days: 7
