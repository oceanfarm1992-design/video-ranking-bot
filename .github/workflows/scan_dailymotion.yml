name: Scan Dailymotion for R2 Buffer

# Dailymotion isn't IP-blocked like YouTube/TikTok, so unlike home_scanner.py's
# other platforms this doesn't need a residential IP - it can run entirely in
# GitHub Actions as a backup-clip reserve, independent of the home PC.
on:
  schedule:
    - cron: "0 */5 * * *"   # every 5 hours
  workflow_dispatch:

jobs:
  scan-dailymotion:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies (ffmpeg)
        run: sudo apt-get install -y ffmpeg

      - name: Install CPU-only PyTorch, then the rest of requirements
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Scan Dailymotion
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python home_scanner.py --platform dailymotion
